---
version: "3"

silent: true

vars:
  DYN_LIBS_USED: "-lstandardloop-logger"
  TEST_EXECUTABLE_NAME: test
  SOURCE_FILES:
    - todo.c
  TEST_SOURCE_FILES:
    - todo.test.c
  # for releasing
  DYLIB_NAME: libstandardloop-todo.dylib
  DYLIB_HEADER: todo.h

includes:
  # c: https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml # can pin in future
  c: ../taskfiles/c.yml

tasks:
  default:
    silent: true
    desc: "Show all avaiable tasks."
    cmds:
      - task --list-all

  dependencies:
    deps:
      - c:dependencies:logger

  release:
    deps:
      - c:release

  test:build:
    deps:
      - dependencies
    cmds:
      - task: c:test:build

  fmt:
    deps:
      - c:fmt

  docs:
    deps:
      - c:docs
