  #   deps:
  #     - docs:bear
  #   vars:
  #     OUT_DIR: docs
  #   cmds:
  #     - mkdir -p {{.OUT_DIR}}/md {{.OUT_DIR}}/json
  #     - clang-doc --format=md --output={{.OUT_DIR}} -p=. {{range .SOURCE_FILES}} {{.}} {{end}}
