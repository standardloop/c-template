---
version: "3"

silent: true

includes:
  c: https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml # ../taskfiles/c.yml # can pin in future

vars:
  DYN_LIBS_USED: "-lstandardloop-logger -lstandardloop-collections -lstandardloop-util"
  TEST_EXECUTABLE_NAME: test
  SOURCE_FILES:
    - todo.c
  TEST_SOURCE_FILES:
    - todo.test.c
  # for releasing
  DYLIB_NAME: libstandardloop-todo.dylib
  DYLIB_HEADER: todo.h

tasks:
  default:
    cmds:
      - task: test

  dependencies:
    cmds:
      - task: c:dependencies:logger
      - task: c:dependencies:util
      - task: c:dependencies:collections

  test:
    deps:
      - test:run

  sanitize:
    deps:
      - test:run-sanitize

  release:
    deps:
      - c:release

  test:build:
    deps:
      - dependencies
    cmds:
      - task: c:test:build

  test:run:
    deps:
      - test:build
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}

  test:build-sanitize:
    deps:
      - dependencies
    cmds:
      - task: c:test:build-sanitize

  test:run-sanitize:
    deps:
      - test:build-sanitize
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}-sanitize

  clean:
    deps:
      - c:test:clean

  fmt:
    deps:
      - c:fmt

  docs:
    deps:
      - c:docs

  test:leaks:
    aliases:
      - leaks
    desc: "Run macOS leaks on the test program."
    deps:
      - test:build
    cmds:
      - cp /usr/local/lib/standardloop/libstandardloop-util.dylib ./
      - cp /usr/local/lib/standardloop/libstandardloop-collections.dylib ./
      - leaks --atExit -- ./{{.TEST_EXECUTABLE_NAME}}
      - rm libstandardloop-util.dylib
      - rm libstandardloop-collections.dylib
