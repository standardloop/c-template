  #   desc: "Build the test program."
  #   cmds:
  #     - |
  #       bear -- {{.CC}} {{.CC_FLAGS}} \
  #       test.c \
  #       -isysroot {{.SDK_PATH}} \
  #       {{range .SOURCE_FILES}} {{.}} {{end}} \
  #       {{range .TEST_SOURCE_FILES}} {{.}} {{end}} \
  #       -o {{.TEST_EXECUTABLE_NAME}}
  #   vars:
  #     SDK_PATH:
  #       sh: xcrun --show-sdk-path
  #   sources:
  #     - "*.c"
  #     - Taskfile.yml
  #   generates:
  #     - compile_commands.json

